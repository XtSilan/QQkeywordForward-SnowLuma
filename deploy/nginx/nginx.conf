worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 24m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # 单一入口：/ → webui；/snowluma/ + /snowluma-api/ → snowluma WebUI；
  # /novnc/ → 远程桌面；/updater/ → CI/CD 更新服务。
  server {
    listen 80;
    server_name _;

    # ---------- SnowLuma WebUI SPA（子路径托管） ----------
    # SnowLuma 的 WebUI 是假设挂在根路径 / 的 SPA（TanStack Router basepath 硬编码 `/`，
    # 接口走绝对 /api/*），无法开箱即用挂到子路径。这里通过响应改写把它搬到 /snowluma/：
    #   1) HTML 里的绝对资源引用加前缀，并注入 API 垫片；
    #   2) JS 包里改写 router basepath 与 Vite 资源 base，再补上前缀；
    #   3) 垫片把 SPA 对 /api/* 的请求转到 /snowluma-api/*，避免与本项目 /api/* 撞车。
    # ⚠️ 第 2 步依赖压缩后的字面量，SnowLuma 发版可能变化 → 升级后必须回归验证子路径。
    location = /snowluma { return 301 /snowluma/; }

    location /snowluma/ {
      proxy_pass http://snowluma:5099/;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      sub_filter_once off;
      sub_filter_types text/html;
      sub_filter 'href="/logo.png"' 'href="/snowluma/logo.png"';
      sub_filter 'src="/assets/' 'src="/snowluma/assets/';
      sub_filter 'href="/assets/' 'href="/snowluma/assets/';
      sub_filter '</head>' '<script src="/snowluma/shim.js"></script></head>';
    }

    location /snowluma/assets/ {
      proxy_pass http://snowluma:5099/assets/;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter_types *;
      # router basepath 默认值（实测全局仅 2 处）
      sub_filter 'basepath??t?.basepath??`/`' 'basepath??t?.basepath??`/snowluma`';
      sub_filter 'options.basepath??`/`' 'options.basepath??`/snowluma`';
      # Vite 资源 base 拼接函数（实测全局仅 1 处）
      sub_filter 'function(e){return`/`+e}' 'function(e){return`/snowluma/`+e}';
      sub_filter '/assets/' '/snowluma/assets/';
      sub_filter '/logo.png' '/snowluma/logo.png';
    }

    location = /snowluma/shim.js {
      alias /etc/nginx/snowluma-shim.js;
      add_header Content-Type application/javascript;
      add_header Cache-Control no-store;
    }

    location /snowluma-api/ {
      proxy_pass http://snowluma:5099/api/;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # SSE/流式接口（日志、状态、调试）需要关闭缓冲
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # ---------- 远程桌面 noVNC（要求已登录控制台） ----------
    location /novnc/ {
      auth_request /_auth;
      error_page 401 =302 /;
      proxy_pass http://snowluma:6081/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # ---------- CI/CD 更新服务 ----------
    location /updater/ {
      proxy_pass http://updater:18081/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # ---------- 控制台（webui） ----------
    location / {
      proxy_pass http://webui:8080;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # 内部鉴权子请求（校验控制台会话 Cookie）
    location = /_auth {
      internal;
      proxy_pass http://webui:8080/api/auth/me;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }
  }
}
